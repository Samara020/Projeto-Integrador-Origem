name: origem

services:
  postgres:
    image: postgres:17
    container_name: origem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: origem_db
      POSTGRES_USER: origem_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "5433:5432"
    volumes:
      - origem_dados:/var/lib/postgresql/data
      - ./database/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origem_user -d origem_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  modulo-ia:
    build:
      context: ./modulo-ia
      target: runtime
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    environment:
      RECOMENDACAO_API_URL: http://modulo-ia:3001
      IA_BASE_URL: http://modulo-ia:3001
      RECOMENDACAO_API_KEY: origem-mockup-key
    restart: unless-stopped

volumes:
  origem_dados:
