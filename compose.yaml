name: origem

services:
  postgres:
    image: postgres:17
    container_name: origem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: origem_db
      POSTGRES_USER: origem_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "5433:5432"
    volumes:
      - origem_dados:/var/lib/postgresql/data
      # Só schema e seed real. O 03_seed_teste.sql (dados fictícios) fica de fora.
      - ./database/sql/01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql:ro
      - ./database/sql/02_integrity_rules.sql:/docker-entrypoint-initdb.d/02_integrity_rules.sql:ro
      - ./database/sql/04_create_indexes.sql:/docker-entrypoint-initdb.d/04_create_indexes.sql:ro
      - ./database/sql/05_seed_dados_reais.sql:/docker-entrypoint-initdb.d/05_seed_dados_reais.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origem_user -d origem_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/app/Dockerfile
      target: runtime
    environment:
      # Se a senha tiver caracteres especiais (@ : / ? # %), codifique-os na URL (percent-encoding).
      DATABASE_URL: postgresql://origem_user:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@postgres:5432/origem_db
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao}
      JWT_EXPIRES_IN: 7d
      PORT: "4000"
      CORS_ORIGIN: http://localhost:3000
      # Cria tabelas/seed se o banco estiver vazio (só para desenvolvimento).
      AUTO_SETUP_DB: "true"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  modulo-ia:
    build:
      context: ./modulo-ia
      target: runtime
    ports:
      - "3001:3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_CONCORRENCIA_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_CONCORRENCIA_API_URL: http://localhost:5000
      API_BASE_URL: http://backend:4000
      BACKEND_URL: http://backend:4000
      RECOMENDACAO_API_URL: http://modulo-ia:3001
      IA_BASE_URL: http://modulo-ia:3001
      RECOMENDACAO_API_KEY: origem-mockup-key
    depends_on:
      backend:
        condition: service_healthy
      modulo-ia:
        condition: service_started
    restart: unless-stopped

volumes:
  origem_dados:
