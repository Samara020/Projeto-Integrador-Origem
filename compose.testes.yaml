name: origem-testes

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: origem_test
      POSTGRES_PASSWORD: teste_local
      POSTGRES_DB: origem_teste
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origem_test -d origem_teste"]
      interval: 5s
      timeout: 5s
      retries: 10
