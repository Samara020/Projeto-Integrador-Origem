name: Testes no merge na main

# Cada commit que chega na main (merge de PR ou push direto, os dois chegam como push):
#   1. regressao: Unitários, API e E2E (testes.yml).
#   2. imagens:   build das imagens Docker multi-stage. O estágio "test" do módulo de IA
#                 roda o pytest dentro da imagem.
# O deploy do frontend é feito pela integração Git da Vercel (ligada ao repositório).
# Este workflow só roda os testes e o build das imagens.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Dois merges seguidos: o deploy mais novo cancela o antigo, nunca o contrário.
concurrency:
  group: testes-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  regressao:
    name: Regressão completa
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/testes.yml

  imagens:
    name: Build das imagens Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-temporary-password
      # Valor descartável usado apenas para interpolar o Compose no build/smoke test.
      JWT_SECRET: segredo-ci-build
    steps:
      - uses: actions/checkout@v7
      - name: Build (compose)
        run: docker compose build
      - name: Smoke test dos containers
        run: |
          docker compose up -d --wait
          curl -sf http://localhost:3001/readyz
          curl -sf http://localhost:4000/health > /dev/null
          curl -sf http://localhost:4000/categorias > /dev/null
          curl -sf http://localhost:3000/ > /dev/null
          docker compose down

      - name: Mostrar logs se falhar
        if: failure()
        run: |
          docker compose ps
          docker compose logs postgres


  quality-gate:
    name: Quality Gate
    if: ${{ always() }}
    needs: [regressao, imagens]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validar automação de alertas, gate e política
        run: node --test .github/scripts/automacao.test.mjs .github/scripts/politica.test.mjs
      # Política de manutenção (docs/tas.md): nenhum .only esquecido, e todo teste pulado
      # ou em quarentena (@flaky) cita uma issue aberta.
      - name: Conferir testes pulados e em quarentena
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/verificar-quarentena.mjs
      - name: Conferir todos os resultados obrigatórios
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/quality-gate.mjs

  issue-falha:
    name: Registrar falha da pipeline
    needs: [regressao, imagens, quality-gate]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure') }}
    concurrency:
      group: aviso-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Baixar relatórios disponíveis
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --name relatorios-testes --dir artefato || true
      - name: Reunir resultados JUnit
        run: |
          mkdir -p relatorios
          if [ -d artefato ]; then
            find artefato -name '*.xml' ! -name 'quarentena-*' -exec cp {} relatorios/ \;
          fi
      - uses: ./.github/actions/abrir-issue-falha
