name: Testes agendados (2h da manhã)

# Regressão completa todo dia às 2h de Brasília. O cron do GitHub é em UTC:
# 2h em Brasília (UTC-3, sem horário de verão desde 2019) = 5h UTC.
# O agendamento só roda no último commit da branch padrão (main) e pode atrasar em
# horário de pico do GitHub. Em repositório público sem atividade por 60 dias, o
# GitHub desliga o agendamento sozinho; reative na aba Actions.
# workflow_dispatch: para demonstrar sem esperar a madrugada.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regressao:
    name: Testes
    permissions:
      contents: read
      actions: read
      issues: read
    uses: ./.github/workflows/testes.yml
    with:
      e2e: completo

  issue-falha:
    name: Registrar falha da pipeline
    needs: regressao
    if: ${{ !cancelled() && needs.regressao.result == 'failure' }}
    concurrency:
      group: aviso-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Baixar relatórios disponíveis
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --name relatorios-testes --dir artefato || true
      - name: Reunir resultados JUnit
        run: |
          mkdir -p relatorios
          if [ -d artefato ]; then
            find artefato -name '*.xml' ! -name 'quarentena-*' -exec cp {} relatorios/ \;
          fi
      - uses: ./.github/actions/abrir-issue-falha
