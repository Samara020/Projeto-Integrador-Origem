name: Revisão periódica da TAS

# Abre a issue da revisão periódica da automação (docs/tas.md) toda segunda, prevista para
# 9h de Brasília (12h UTC), com os números atuais da suíte e o roteiro. Se a revisão anterior
# ainda estiver aberta, comenta nela em vez de abrir outra.
# workflow_dispatch: para abrir fora da data.
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  abrir:
    name: Abrir issue de revisão
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo: a revisão lista os arquivos de teste há mais tempo sem commit.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Abrir a issue com os números da suíte
        run: node .github/scripts/revisao-periodica.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
